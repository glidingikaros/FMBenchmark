[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmbenchmark"
version = "0.6.0"
description = "A modular framework for benchmarking large language models in disk forensics."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
    "pefile==2024.8.26",
    "pyyaml>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
generation = ["python-evtx==0.8.1"]
factual = ["python-registry==1.3.1", "python-evtx==0.8.1"]
collection = ["pytsk3==20260715", "libvmdk-python==20260714", "python-registry==1.3.1"]
dev = [
    "coverage[toml]>=7.6",
    "pytest>=8",
    "pytest-xdist>=3.8",
    "ruff>=0.8",
]

[project.scripts]
fmb = "fmb.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["fmb*"]
exclude = ["fmb.contracts*", "fmb.fixtures*", "fmb.tools*", "fmb.generation.ansible*", "fmb.collection.tools.kape.assets*"]

[tool.setuptools.package-data]
fmb = [
    "paper-source-manifest.json",
    "contracts/**/*", "fixtures/paper/**/*", "fixtures/native-event-sequence/*",
    "generation/**/*",
    "collection/tools/kape/assets/**/*", "collection/tools/host/*.json",
    "index/scanners/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: local multi-module integration tests that do not run external forensic tools",
    "smoke: fast executable sanity checks for imports and source contracts",
    "external: opt-in checks that require host tools, VMs, network, or large artifacts",
    "slow: tests expected to run noticeably longer than the default local suite",
    "pwsh: tests that exercise local PowerShell helpers without a Windows VM",
]

[tool.coverage.run]
branch = true
source = ["fmb"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/bootstrap_*.py" = ["E402"]
"scripts/seal_paper_sources.py" = ["E402"]
"tools/base-image/windows11-x64/install.py" = ["E402"]
"tests/unit/test_host_collector.py" = ["E731"]
"tests/unit/test_usn_chronology_completeness.py" = ["E731"]

[[tool.uv.dependency-metadata]]
name = "unicodecsv"
version = "0.14.1"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "pytsk3"
version = "20260715"
requires-dist = []
requires-python = ">=3.10"

[[tool.uv.dependency-metadata]]
name = "libvmdk-python"
version = "20260714"
requires-dist = []
requires-python = ">=3.10"
