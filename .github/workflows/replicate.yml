name: Replicate

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "A link to Windows11_Client_x64_en-us_26300_9457.iso from microsoft.com/software-download/windows11 (valid 24 hours; kept out of the logs)"
        type: string
        required: true
      hosts:
        description: "Windows hosts are work in progress: generation works, evidence collection does not yet"
        type: choice
        options: [linux, windows, both]
        default: linux
      images:
        description: "The images to generate and run, as a JSON list of names of files in images/ (such as I1) or of paths ending in .json (such as tests/fixtures/images/stress.json)"
        type: string
        default: '["I1", "I2", "I3"]'

permissions:
  contents: read

env:
  ISO: Windows11_Client_x64_en-us_26300_9457.iso

jobs:
  linux:
    if: inputs.hosts != 'windows'
    name: linux ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: "runner: the image's name"
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=$(basename "$IMAGE" .json)" >> "$GITHUB_OUTPUT"
      - name: "runner: disk (fmb's cache, FMB_CACHE, and the generated/ and results/ folders on the scratch disk)"
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/dotnet /usr/local/share/boost
          sudo mkdir -p /mnt/fmb/generated /mnt/fmb/results && sudo chown -R "$USER" /mnt/fmb
          ln -s /mnt/fmb/generated generated && ln -s /mnt/fmb/results results
          echo "FMB_CACHE=/mnt/fmb/cache" >> "$GITHUB_ENV"
          df -h / /mnt
          lscpu | grep -E 'Model name|Hypervisor'
      - name: Microsoft's ISO, saved in ~/Downloads as a browser saves it
        run: |
          url=$(jq -r .inputs.iso_url "$GITHUB_EVENT_PATH")
          echo "::add-mask::$url"
          mkdir -p ~/Downloads
          curl -fsSL --retry 5 --retry-all-errors -o ~/Downloads/"$ISO" "$url"
          ls -l ~/Downloads
      - name: "README, Linux: QEMU and OVMF (runner: -y answers apt's question)"
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf
      - name: "README, Linux: /dev/kvm (runner: later steps start through sg kvm, as a new login would)"
        run: |
          ls -l /dev/kvm && id
          sudo usermod -aG kvm "$USER"
      - name: uv, installed as docs.astral.sh/uv says
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "README: uv sync --locked --all-extras"
        run: uv sync --locked --all-extras
      - name: "README: setup --check, before setup"
        continue-on-error: true
        run: sg kvm -c "uv run fmb setup --check"
      - name: "README: setup --iso"
        run: sg kvm -c "uv run fmb setup --iso ~/Downloads/$ISO"
      - name: "README: generate ${{ matrix.image }}"
        run: sg kvm -c "uv run fmb generate ${{ matrix.image }}"
      - name: "README: run ${{ matrix.image }}"
        run: sg kvm -c "uv run fmb run ${{ steps.image.outputs.name }}"
      - name: Summary
        if: always()
        run: |
          cat /mnt/fmb/results/*/*/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          { echo '```'; cat /mnt/fmb/cache/qemu-bases/fmb-VAGRANTSLASH-windows-11-x64/0/guest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: user-path-linux-${{ steps.image.outputs.name }}
          path: |
            /mnt/fmb/results/*/*/report.md
            /mnt/fmb/results/*/*/summary.json
            /mnt/fmb/results/*/*/pipeline.log
            /mnt/fmb/results/*/*/receipts/
            /mnt/fmb/results/*/*/run/gates/*.json
            /mnt/fmb/results/*/*/run/run-manifest.json
            /mnt/fmb/results/*/*/run/analysis/evidence_index.json
            /mnt/fmb/generated/*/*.log
            /mnt/fmb/generated/*/image.json
            /mnt/fmb/generated/*/generation/**/*.png
            /mnt/fmb/cache/qemu-bases/**/guest.json
            /mnt/fmb/cache/base-build/*.log
            /mnt/fmb/cache/base-build/shots/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  windows:
    if: inputs.hosts != 'linux'
    name: windows ${{ matrix.image }}
    runs-on: windows-2025
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: "runner: a stock Windows 11 has long paths off (this image turns them on); disk"
        run: |
          Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem | Select-Object LongPathsEnabled
          Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB'; e={[int]($_.Free / 1GB)}}
          if ((Get-PSDrive C).Free / 1GB -lt 70) {
            "FMB_CACHE=$env:RUNNER_TEMP\fmb-cache" >> $env:GITHUB_ENV
            "runner: C: is small; FMB_CACHE=$env:RUNNER_TEMP\fmb-cache"
          }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: "runner: the image's name"
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: '"name=$([IO.Path]::GetFileNameWithoutExtension($env:IMAGE))" >> $env:GITHUB_OUTPUT'
      - name: Git's line-ending settings the checkout ran with
        run: git config --show-origin --get-all core.autocrlf; git ls-files --eol src/fmb/replication/run.py
      - name: Microsoft's ISO, saved in Downloads as a browser saves it
        run: |
          $url = (Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json).inputs.iso_url
          Write-Output "::add-mask::$url"
          New-Item -ItemType Directory -Force "$HOME\Downloads" | Out-Null
          curl.exe -fsSL --retry 5 --retry-all-errors -o "$HOME\Downloads\$env:ISO" $url
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem "$HOME\Downloads" | Format-Table Name, Length
      - name: "README, Windows: the administrator PowerShell block (runner: no reboot; prompts answered)"
        id: admin
        timeout-minutes: 25
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $gaps = @()
          Enable-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform -NoRestart | Format-List RestartNeeded
          if (-not $?) { $gaps += "Enable-WindowsOptionalFeature HypervisorPlatform failed" }
          New-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
          if (-not $?) { $gaps += "New-ItemProperty LongPathsEnabled failed" }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install SoftwareFreedomConservancy.QEMU --accept-source-agreements --accept-package-agreements --disable-interactivity
          } else { $gaps += "no winget on the runner" }
          if (-not (Test-Path 'C:\Program Files\qemu\qemu-system-x86_64.exe')) {
            $gaps += "winget gave no QEMU: installed from Chocolatey instead"
            choco install qemu -y --no-progress | Select-Object -Last 3
          }
          wsl --install -d Ubuntu-24.04 --no-launch
          wsl --set-version Ubuntu-24.04 1
          wsl -d Ubuntu-24.04 --exec uname -a
          if ($LASTEXITCODE) { $gaps += "wsl --install gave no working Ubuntu-24.04"; "wsl=missing" >> $env:GITHUB_OUTPUT }
          else { "wsl=ok" >> $env:GITHUB_OUTPUT }
          wsl --list --verbose
          foreach ($gap in $gaps) { "::warning::runner gap: $gap"; "- runner gap: $gap" >> $env:GITHUB_STEP_SUMMARY }
          exit 0
      - name: "runner: WSL through setup-wsl, as the documented commands did not give a working distribution"
        if: steps.admin.outputs.wsl != 'ok'
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          use-cache: false
      - name: uv, installed as docs.astral.sh/uv says
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          "$HOME\.local\bin" >> $env:GITHUB_PATH
      - name: "README: uv sync --locked --all-extras"
        run: uv sync --locked --all-extras
      - name: "README: setup --check, before setup"
        continue-on-error: true
        run: uv run fmb setup --check
      - name: "README: setup --iso"
        run: uv run fmb setup --iso ~/Downloads/${{ env.ISO }}
      - name: "README: generate ${{ matrix.image }}"
        run: uv run fmb generate ${{ matrix.image }}
      - name: "README: run ${{ matrix.image }}"
        run: uv run fmb run ${{ steps.image.outputs.name }}
      - name: Summary
        if: always()
        run: |
          $cache = if ($env:FMB_CACHE) { $env:FMB_CACHE } else { "$HOME\.cache\fmb" }
          "CACHE=$cache" >> $env:GITHUB_ENV
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content results\*\*\report.md, "$cache\qemu-bases\fmb-VAGRANTSLASH-windows-11-x64\0\guest.json" -ErrorAction SilentlyContinue >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: user-path-windows-${{ steps.image.outputs.name }}
          path: |
            results/*/*/report.md
            results/*/*/summary.json
            results/*/*/pipeline.log
            results/*/*/receipts/
            results/*/*/run/gates/*.json
            results/*/*/run/run-manifest.json
            results/*/*/run/analysis/execution/**/tool-logs/
            generated/*/*.log
            generated/*/image.json
            generated/*/generation/**/*.png
            ${{ env.CACHE }}/qemu-bases/**/guest.json
            ${{ env.CACHE }}/base-build/*.log
            ${{ env.CACHE }}/base-build/shots/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
