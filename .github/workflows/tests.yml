name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: ${{ matrix.os }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows takes twice as long as the others, so it runs as two disjoint halves.
        include:
          - {os: ubuntu-24.04, shard: 1/1}
          - {os: macos-15, shard: 1/1}
          - {os: windows-2025, shard: 1/2}
          - {os: windows-2025, shard: 2/2}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.9.9"
          python-version: "3.13.5"
          enable-cache: false
      - name: Install
        run: uv sync --locked --extra dev --extra generation --extra factual --extra collection
      - name: CLI
        run: uv run --no-sync fmb --help
      - name: Test suite
        run: uv run --no-sync python -m pytest -m "not external" -n 4 -q -p no:cacheprovider --durations=15 --shard ${{ matrix.shard }}
