---
- name: Execute every bounded executable and remove one
  ansible.windows.win_shell: |
    {{ lookup('file', role_path + '/files/operations.ps1') | indent(4) }}
    $ErrorActionPreference = 'Stop'
    $scenarioInput = [Console]::In.ReadToEnd() | ConvertFrom-Json
    $case = [string]$scenarioInput.case
    if ($case -notin @('positive', 'benign')) {
      throw "Unsupported generation case"
    }
    $populationPaths = @($scenarioInput.population_paths)
    $paths = @($scenarioInput.operation_refs)
    $expectedPopulationCount = [int]$scenarioInput.expected_population_count
    $expectedOperationCount = [int]$scenarioInput.expected_operation_count
    $operationRefsSha256 = Get-OperationRefsSha256 $paths
    if (
      $expectedPopulationCount -lt 1 -or
      $populationPaths.Count -ne $expectedPopulationCount -or
      ($case -eq 'positive' -and ($expectedOperationCount -lt 1 -or $expectedOperationCount -gt $expectedPopulationCount)) -or
      ($case -eq 'benign' -and $expectedOperationCount -ne 0) -or
      $paths.Count -ne $expectedOperationCount
    ) {
      throw "Prefetch population cardinality is invalid"
    }
    foreach ($path in $populationPaths) {
       Start-Process -FilePath ([string]$path) -WindowStyle Hidden -Wait 
    }
    # Windows writes .pf files in the background, and a guest that has only just logged on can take well over 30 s.
    # The loop ends as soon as every file exists, so a longer deadline changes nothing for a guest that is on time.
    $waitStarted = Get-Date
    $deadline = $waitStarted.AddSeconds([Math]::Max(180, 3 * $populationPaths.Count))
    do {
      $prefetchCount = 0
      foreach ($path in $populationPaths) {
        $prefetchName = [IO.Path]::GetFileName([string]$path)
        if (Get-ChildItem -LiteralPath 'C:\Windows\Prefetch' `
            -Filter "$prefetchName-*.pf" `
            -ErrorAction SilentlyContinue | Select-Object -First 1) {
          $prefetchCount += 1
        }
      }
      if ($prefetchCount -lt $populationPaths.Count) {
        Start-Sleep -Seconds 2
      }
    } while ($prefetchCount -lt $populationPaths.Count -and (Get-Date) -lt $deadline)
    $waitedSeconds = [int]((Get-Date) - $waitStarted).TotalSeconds
    if ($case -eq 'positive') {
      foreach ($operationPath in @($paths | ForEach-Object { [string]$_ })) {
        Invoke-PaperOperation ("Remove-Item -LiteralPath " + (ConvertTo-OperationLiteral $operationPath) + " -Force")
      }
      $remaining = @($paths | Where-Object { Test-Path -LiteralPath ([string]$_) }).Count
      $filesVerified = $remaining -eq 0
      $verified = (
        $prefetchCount -eq $populationPaths.Count -and
        $remaining -eq 0
      )
    }
    else {
      $retainedCount = @(
        $populationPaths | Where-Object {
          Test-Path -LiteralPath ([string]$_) -PathType Leaf
        }
      ).Count
      $filesVerified = $retainedCount -eq $populationPaths.Count
      $verified = (
        $prefetchCount -eq $populationPaths.Count -and
        $retainedCount -eq $populationPaths.Count
      )
    }
    if (-not $verified) {
      # Counts and guest state only: like the receipt, the reason must not say which files the case touched.
      $sysMain = Get-Service -Name 'SysMain' -ErrorAction SilentlyContinue
      $prefetcher = (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' `
        -Name 'EnablePrefetcher' -ErrorAction SilentlyContinue).EnablePrefetcher
      try {
        $uptimeSeconds = [int]((Get-Date) - (Get-CimInstance -ClassName Win32_OperatingSystem).LastBootUpTime).TotalSeconds
      }
      catch {
        $uptimeSeconds = $null
      }
      [ordered]@{
        prefetch_count = $prefetchCount
        population_count = $populationPaths.Count
        files_verified = $filesVerified
        waited_seconds = $waitedSeconds
        sysmain = $(if ($sysMain) { [string]$sysMain.Status } else { 'missing' })
        enable_prefetcher = $prefetcher
        uptime_seconds = $uptimeSeconds
      } | ConvertTo-Json -Compress
      exit 3
    }
    [ordered]@{
      scenario_id = 'prefetch_wipe_01'
      case = $case
      operation_count = $paths.Count
      operation_refs_sha256 = $operationRefsSha256
      postcondition_verified = $verified
      population_count = $populationPaths.Count
      prefetch_count = $prefetchCount
    } | ConvertTo-Json -Compress
  args:
    stdin: "{{ generation_inputs.scenario_inputs.prefetch_wipe_01 | to_json }}"
  register: prefetch_receipt
  # Exit code 3 is the postcondition failure, reported by the next task without the hidden inputs.
  failed_when: prefetch_receipt.rc | default(1) not in [0, 3]
  no_log: true

- name: Require Windows to write every Prefetch file
  ansible.builtin.assert:
    that:
      - prefetch_receipt.rc == 0
    fail_msg: >-
      Prefetch population postcondition failed:
      {{ (prefetch_receipt.stdout | trim | from_json).prefetch_count | default('unknown') }} of
      {{ (prefetch_receipt.stdout | trim | from_json).population_count | default('unknown') }} .pf files after
      {{ (prefetch_receipt.stdout | trim | from_json).waited_seconds | default('unknown') }} s
      (files verified: {{ (prefetch_receipt.stdout | trim | from_json).files_verified | default('unknown') }},
      SysMain: {{ (prefetch_receipt.stdout | trim | from_json).sysmain | default('unknown') }},
      EnablePrefetcher: {{ (prefetch_receipt.stdout | trim | from_json).enable_prefetcher | default('unknown') }},
      uptime: {{ (prefetch_receipt.stdout | trim | from_json).uptime_seconds | default('unknown') }} s)

- name: Emit host-captured Prefetch receipt
  ansible.builtin.debug:
    msg:
      - "GROUND_TRUTH_BEGIN"
      - "{{ prefetch_receipt.stdout | trim }}"
      - "GROUND_TRUTH_END"
