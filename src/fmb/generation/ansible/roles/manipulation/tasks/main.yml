---
- name: Log scenario execution
  ansible.builtin.debug:
    msg: "Executing manipulation scenarios: {{ scenario | default('baseline') }}"

- name: Normalize scenario list
  ansible.builtin.set_fact:
    scenario_list: "{{ scenario.split(',') if ',' in scenario else [scenario] }}"
  when: scenario is defined and scenario != 'baseline'

- name: Guest clock checkpoint before the bounded population
  ansible.builtin.include_tasks: "{{ playbook_dir }}/clock_checkpoint.yml"
  vars:
    fmb_clock_stage: manipulation_start
  when: fmb_clock_policy is defined

- name: Materialize bounded population before scenario operations
  ansible.builtin.include_tasks: materialize_population.yml
  when: generation_inputs is defined
  no_log: true

- name: Materialize the opt-in pilot before ordinary scenario activity
  ansible.builtin.include_tasks: pilot_challenge.yml
  vars:
    fmb_pilot_stage: materialize
  when: (fmb_factual_challenge_plan | default({})).get('profile', '') == 'pilot_min.v1'

- name: Include specific scenario tasks with a fresh remote connection
  ansible.builtin.include_tasks: execute_scenario.yml
  loop: "{{ scenario_list }}"
  loop_control:
    loop_var: fmb_scenario_item
    label: "{{ fmb_scenario_item }}"
  when: scenario is defined and scenario != 'baseline'

- name: Guest clock checkpoint after the scenario operations
  ansible.builtin.include_tasks: "{{ playbook_dir }}/clock_checkpoint.yml"
  vars:
    fmb_clock_stage: manipulation_end
  when: fmb_clock_policy is defined
