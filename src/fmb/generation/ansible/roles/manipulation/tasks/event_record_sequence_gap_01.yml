---
- name: Verify native retained Security records before offline identifier intervention
  ansible.windows.win_shell: |
    {{ lookup('file', role_path + '/files/operations.ps1') | indent(4) }}
    $ErrorActionPreference = 'Stop'
    $scenarioInput = [Console]::In.ReadToEnd() | ConvertFrom-Json
    $case = [string]$scenarioInput.case
    $paths = @($scenarioInput.operation_refs)
    $operationRefsSha256 = Get-OperationRefsSha256 $paths
    if (($case -eq 'positive' -and ($paths.Count -ne 1 -or [string]$paths[0] -cne 'Security')) -or
        ($case -eq 'benign' -and $paths.Count -ne 0)) {
      throw "Event sequence population cardinality is invalid"
    }
    $tail = @(Get-WinEvent -LogName Security -MaxEvents 3 -ErrorAction Stop)
    if ($tail.Count -ne 3) { throw "Event sequence preparation requires three native records" }
    [ordered]@{
      scenario_id = 'event_record_sequence_gap_01'
      case = $case
      operation_count = $paths.Count
      operation_refs_sha256 = $operationRefsSha256
      postcondition_verified = $true
      retained_tail_count = $tail.Count
    } | ConvertTo-Json -Compress
  args:
    stdin: "{{ generation_inputs.scenario_inputs.event_record_sequence_gap_01 | to_json }}"
  register: sequence_receipt
  no_log: true

- name: Emit host-captured event sequence preparation receipt
  ansible.builtin.debug:
    msg:
      - "GROUND_TRUTH_BEGIN"
      - "{{ sequence_receipt.stdout | trim }}"
      - "GROUND_TRUTH_END"
